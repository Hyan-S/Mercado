spring.application.name=Mercado

# Conexão com o SQL Server (o mesmo que aparece no SSMS)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=Mercado;encrypt=true;trustServerCertificate=true
# Usuário e senha ficam em credenciais.properties (fora do git)
spring.config.import=optional:classpath:credenciais.properties
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cria/atualiza a tabela PRODUTO a partir da entidade
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8081
